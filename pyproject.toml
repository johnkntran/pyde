[project]
name = "pyde"
# Placeholder for development builds. A release takes its version from its git
# tag; see .github/workflows/ci.yml.
version = "0.0.0"
description = "The code editor written in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygments>=2.21.0",
    "pyside6>=6.12.0",
]

[project.scripts]
pyde = "pyde.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# These folders hold hook scripts and unlinted snippets, not app code.
extend-exclude = [".claude", ".codex", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
