<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pyde terminal</title>
    <link rel="stylesheet" href="xterm/xterm.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

        padding: 4px 0 0 8px;

  </head>
  <body>
    <div id="terminal"></div>
    <script src="terminal.js"></script>
  </body>
</html>
