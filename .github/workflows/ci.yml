name: CI

# Pull requests get linted, tested, and packaged. A new version tag such as
# v0.1.0 does the same, building the app as version 0.1.0, and then publishes
# the disk image to that tag's GitHub Release, creating the release if it does
# not exist yet.
on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  package:
    # macos-latest is Apple Silicon, which is the only architecture Pyde ships for.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Take the version from the tag
        if: github.ref_type == 'tag'
        run: uv version "${GITHUB_REF_NAME#v}"
      - run: scripts/build_dmg.sh
      - name: Smoke-test the packaged app
        run: dist/Pyde.app/Contents/MacOS/Pyde --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmg
      - name: Publish the disk image to the GitHub Release
        # Creating a release on GitHub's website also creates its tag, so the
        # release may already exist by the time this runs.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.dmg --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
